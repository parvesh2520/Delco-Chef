name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: delco, POSTGRES_PASSWORD: delco, POSTGRES_DB: delco_test }
        ports: ["55432:5432"]
        options: --health-cmd "pg_isready -U delco" --health-interval 2s --health-retries 30
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r requirements.txt ruff
      - name: Lint
        run: ruff check app tests scripts --select E9,F63,F7,F82
      - name: Migrations apply, roll back and match the models
        env: { DATABASE_URL: "postgresql://delco:delco@localhost:55432/delco_test", DIRECT_URL: "postgresql://delco:delco@localhost:55432/delco_test", RUN_WORKERS: "false" }
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head && alembic check
      - name: Tests
        run: pytest
      - name: Build image
        run: docker build --build-arg GIT_COMMIT=${{ github.sha }} -t delco-api .

  mobile:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo export --platform android --output-dir /tmp/bundle

  # Deploys main to Render via its deploy hook once tests pass (set RENDER_DEPLOY_HOOK in repo secrets).
  deploy:
    needs: [backend, mobile]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy
        env: { HOOK: "${{ secrets.RENDER_DEPLOY_HOOK }}" }
        run: |
          if [ -z "$HOOK" ]; then echo "RENDER_DEPLOY_HOOK not set; skipping deploy"; exit 0; fi
          curl -fsS -X POST "$HOOK"
